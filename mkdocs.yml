site_name: Cheminformatics
site_description: A cheminformatics platform for structure-based drug design
repo_url: https://github.com/brian-day/cheminformatics
repo_name: brian-day/cheminformatics

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - CLI: cli.md
  - Web app: web-app.md
  - API reference:
      - io: api/io.md
      - descriptors: api/descriptors.md
      - fingerprints: api/fingerprints.md
