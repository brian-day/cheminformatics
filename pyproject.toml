[project]
name = "cheminformatics"
version = "0.1.0"
description = "A cheminformatics platform for structure-based drug design"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdkit>=2024.3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
protein = [
    "pdbfixer>=1.12.0",
]
docking = [
    "gemmi>=0.7.5",
    "meeko>=0.7.1",
    "openbabel-wheel>=3.1.1.23",
    "scipy>=1.18.1",
]

[project.scripts]
chem = "cheminformatics.cli:app"
chem-web = "cheminformatics.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheminformatics"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
