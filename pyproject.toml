[project]
name = "cheminformatics"
version = "0.1.0"
description = "A cheminformatics platform for structure-based drug design"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdkit>=2024.3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
chem = "cheminformatics.cli:app"
chem-web = "cheminformatics.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheminformatics"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
